[project]
name = "permission-rag"
version = "0.1.0"
description = "Permission-aware hybrid retrieval on PostgreSQL and pgvector. Synthetic data, retrieval only."
requires-python = ">=3.12"
dependencies = [
    "fastembed>=0.9.1",
    "psycopg[binary]>=3.3.9",
]

[build-system]
requires = ["uv_build>=0.12.24,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
# S101: asserts are the point of tests. S608: the only SQL built with f-strings joins
# module constants (the filter and the column list), never user input.
ignore = ["S101", "S608"]

[tool.mypy]
strict = true
files = ["src", "tests"]
